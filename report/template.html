<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusCheck Report</title>
<!-- fully offline: no external requests; Chart.js is inlined from report/vendor -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<script>/*__CHART_JS__*/</script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #22c55e; --warn: #f97316;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b22; --text: #f3f4f6; --muted: #9ca3af; --line: #2a2f3a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  header .meta { display: block; font-size: 14px; margin-top: 2px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-top: 16px; }
  .hero { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; }
  .score { font-size: 88px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
  .score small { font-size: 36px; }
  .vs { font-size: 28px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
  .vs .plan { color: var(--muted); }
  .vs .real { color: var(--warn); }
  .vs .real.good { color: var(--accent); }
  .bars { margin-top: 16px; display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 70px; gap: 10px; align-items: center; font-size: 14px; }
  .bar-track { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 7px; }
  .timeline { display: flex; height: 44px; border-radius: 10px; overflow: hidden; background: var(--line); }
  .timeline div { height: 100%; }
  .axis { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .breakdown { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: center; }
  .breakdown ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .breakdown li { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fact { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .fact b { display: block; font-size: 26px; letter-spacing: -0.02em; }
  .fact span { font-size: 13px; color: var(--muted); }
  .advice p { margin: 0 0 12px; }
  .advice ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 10px;
         background: #0e72ed; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none;
         transition: background .15s; }
  .btn:hover { background: #2b86f5; }
  .btn:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  footer { margin-top: 24px; text-align: center; font-size: 13px; color: var(--muted); }
  @media (max-width: 720px) {
    .hero, .grid2, .breakdown { grid-template-columns: 1fr; }
    .score { font-size: 64px; }
    .vs { font-size: 22px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>FocusCheck · session report</h1>
      <span class="muted meta" id="meta"></span>
    </div>
    <a class="btn" href="history.html">All sessions →</a>
  </header>

  <section class="card hero">
    <div>
      <h2>Focus score</h2>
      <div class="score" id="score"></div>
    </div>
    <div>
      <h2>What you expected vs. what happened</h2>
      <div class="vs" id="vs"></div>
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <section class="card">
    <h2>Timeline</h2>
    <div class="timeline" id="timeline"></div>
    <div class="axis muted" id="axis"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>Where the time went</h2>
      <div class="breakdown">
        <div><canvas id="donut" width="200" height="200"></canvas></div>
        <ul id="breakdown"></ul>
      </div>
    </section>
    <section class="card">
      <h2>Key facts</h2>
      <div class="facts" id="facts"></div>
    </section>
  </div>

  <section class="card advice">
    <h2>Coach <span class="tag" id="advice-src"></span></h2>
    <p id="analysis"></p>
    <ol id="tips"></ol>
  </section>

  <footer id="privacy"></footer>
</main>

<script>
const DATA = /*__SESSION_DATA__*/null;
const S = DATA.session, M = S.summary, C = DATA.colors, L = DATA.labels;
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); Object.assign(e, attrs); if (text != null) e.textContent = text; return e; };
const fmtMin = m => (Math.round(m * 10) / 10).toString().replace(/\.0$/, "") + " min";

// meta line
const started = new Date(S.started_at);
$("meta").textContent = (S.name ? S.name + " · " : "") +
  started.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });

// hero
$("score").append(String(Number(M.focus_pct) || 0), el("small", {}, "%"));  // no innerHTML with data
const good = M.focus_pct >= M.self_estimate_pct;
$("vs").innerHTML = "";
$("vs").append(
  el("span", { className: "plan" }, `You expected ${M.self_estimate_pct}% focus (≈ ${fmtMin(M.self_estimate_min)}).`),
  el("br"),
  el("span", { className: "real" + (good ? " good" : "") }, `Reality: ${M.focus_pct}% (${fmtMin(M.focused_min)}).`)
);
[["Expected", M.self_estimate_pct, "var(--muted)"], ["Actual", M.focus_pct, C.FOCUSED]].forEach(([name, v, color]) => {
  const row = el("div", { className: "bar-row" });
  const track = el("div", { className: "bar-track" });
  const fill = el("div", { className: "bar-fill" });
  fill.style.width = v + "%"; fill.style.background = color;
  track.append(fill);
  row.append(el("span", {}, name), track, el("span", { className: "muted" }, v + "%"));
  $("bars").append(row);
});

// timeline: run-length encoded segments
const ev = S.events || [];
const total = Math.max(ev.length, 1);
let runs = [];
ev.forEach(e => {
  const last = runs[runs.length - 1];
  if (last && last.state === e.state) last.n++; else runs.push({ state: e.state, n: 1, start: e.t });
});
runs.forEach(r => {
  const d = el("div");
  d.style.width = (r.n / total * 100) + "%";
  d.style.background = C[r.state] || "#ccc";
  d.title = `${L[r.state] || r.state}: ${Math.floor(r.start / 60)}:${String(r.start % 60).padStart(2, "0")} · ${r.n}s`;
  $("timeline").append(d);
});
const totMin = total / 60;
const ticks = 5;
for (let i = 0; i <= ticks; i++) $("axis").append(el("span", {}, `${Math.round(totMin * i / ticks * 10) / 10}m`));
Object.keys(L).forEach(k => {
  const item = el("span");
  const dot = el("span", { className: "dot" }); dot.style.background = C[k];
  item.append(dot, L[k]);
  $("legend").append(item);
});

// breakdown
const parts = [
  ["FOCUSED", M.focused_min], ["DISTRACTED_SCREEN", M.distracted_screen_min],
  ["LOOKING_AWAY", M.looking_away_min], ["AWAY", M.away_min],
];
parts.forEach(([k, v]) => {
  const li = el("li");
  const name = el("span"); const dot = el("span", { className: "dot" }); dot.style.background = C[k];
  name.append(dot, L[k]);
  li.append(name, el("b", {}, fmtMin(v)));
  $("breakdown").append(li);
});
if (window.Chart) {
  new Chart($("donut"), {
    type: "doughnut",
    data: { labels: parts.map(p => L[p[0]]),
            datasets: [{ data: parts.map(p => p[1]), backgroundColor: parts.map(p => C[p[0]]), borderWidth: 0 }] },
    options: { cutout: "62%", plugins: { legend: { display: false } }, responsive: false },
  });
} else {
  $("donut").parentElement.style.display = "none";  // offline: the list above is enough
}

// facts
[
  [M.distraction_count, "distractions (≥10 s)"],
  [fmtMin(M.longest_focus_streak_min), `longest focus streak (min ${M.longest_focus_streak_start_min}–${M.longest_focus_streak_end_min})`],
  [M.best_segment_focus_pct + "%", `best stretch: min ${M.best_segment_start_min}–${M.best_segment_end_min}`],
  [fmtMin(M.total_min), "session time (without pauses)"],
  [M.nudges_count, "reminders"],
].forEach(([v, label]) => {
  const f = el("div", { className: "fact" });
  f.append(el("b", {}, String(v)), el("span", {}, label));
  $("facts").append(f);
});

// advice
const A = S.advice || { analysis: "", tips: [] };
$("advice-src").textContent = "based on your numbers";
$("analysis").textContent = A.analysis;
A.tips.forEach(t => $("tips").append(el("li", {}, t)));

$("privacy").textContent = "🔒 " + DATA.privacy;
</script>
</body>
</html>
